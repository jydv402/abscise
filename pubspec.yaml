name: abscise
description: "A swipe-based photo cleanup app"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9 
  go_router: ^13.0.0
  flutter_svg: ^2.0.9
  image_picker: ^1.0.7
  photo_manager: ^3.3.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  flutter_animate: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-VariableFont_wght.ttf