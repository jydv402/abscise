name: abscise
description: "A swipe-based photo cleanup app"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1 
  go_router: ^17.2.3
  flutter_svg: ^2.0.9
  image_picker: ^1.0.7
  photo_manager: ^3.3.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  flutter_animate: ^4.3.0
  iconify_flutter: ^0.0.7
  google_sign_in: ^7.2.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-VariableFont_wght.ttf

flutter_launcher_icons:
  #  image_path: "assets/images/icon-128x128.png"
  image_path_android: "assets/branding/abscise_logo.png"
  android: true # can specify file name here e.g. "ic_launcher"
  # adaptive_icon_background: "assets/branding/abscise_logo_bg.png" # only available for Android 8.0 devices and above
  # adaptive_icon_foreground: "assets/branding/abscise_logo_fg.png" # only available for Android 8.0 devices and above
  adaptive_icon_foreground_inset: 24 # only available for Android 8.0 devices and above
  # adaptive_icon_monochrome: "assets/branding/abscise_logo_bw.png" # only available for Android 13 devices and above
  min_sdk_android: 21 # android min sdk min:16, default 21