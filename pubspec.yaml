name: abscise
description: "A swipe-based photo cleanup app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1 
  go_router: ^17.2.3
  flutter_svg: ^2.0.9
  image_picker: ^1.0.7
  photo_manager: ^3.3.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  flutter_animate: ^4.3.0
  iconify_flutter: ^0.0.7
  photo_manager_image_provider: ^2.2.0
  video_player: ^2.11.1
  url_launcher: ^6.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_staggered_grid_view: ^0.7.0
  update_checker_bottom_sheet: ^0.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/branding/abscise_logo_fg.png
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-VariableFont_wght.ttf

