name: Build Abscise App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Flutter clean
        run: flutter clean

      - name: Getting Dependencies
        run: flutter pub get

      - name: Extract version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VERSION_NAME=$(echo $VERSION | cut -d'+' -f1)
          VERSION_CODE=$(echo $VERSION | cut -d'+' -f2)

          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Decode keystore from GitHub Secret
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/abscise-keystore.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=app/abscise-keystore.jks" >> android/key.properties

      - name: Build signed APKs
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Rename APK files
        run: |
          cd build/app/outputs/flutter-apk

          mv app-armeabi-v7a-release.apk \
            abscise-armeabi-v7a-${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.version_code }}.apk

          mv app-arm64-v8a-release.apk \
            abscise-arm64-v8a-${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.version_code }}.apk

          mv app-x86_64-release.apk \
            abscise-x86_64-${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.version_code }}.apk

          mv app-release.apk \
            abscise-universal-${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.version_code }}.apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: build/app/outputs/flutter-apk/abscise-*.apk

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/abscise-*.apk"
          tag: ${{ github.ref_name }}
          name: Abscise ${{ github.ref_name }}
          body: |
            ### Release Notes

            - **Version:** ${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.version_code }}

            ---

            ### Which file should I download?

            Please choose the appropriate APK for your device architecture:

            * **`abscise-arm64-v8a-...apk`**: Recommended for almost all modern Android phones and tablets (64-bit ARM devices).
            * **`abscise-armeabi-v7a-...apk`**: For older 32-bit ARM Android phones and tablets.
            * **`abscise-x86_64-...apk`**: For Android emulators, ChromeOS/Chromebooks etc...
            * **`abscise-universal-...apk`**: Works across Android architectures. Download this if you're unsure which version to choose.

            ---

            *Note: If you are not sure, download the **`universal`** APK.*

          token: ${{ secrets.GITHUB_TOKEN }}